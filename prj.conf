# For peripherals
CONFIG_GPIO=y
CONFIG_I2C=y

# For BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="NML910"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_PM_DEVICE=y

# For RTT logging
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n
CONFIG_CBPRINTF_FP_SUPPORT=y